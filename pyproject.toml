[project]
name = "se"
version = "0.1.0"
description = "Probe and fill IPv4 addresses in Excel deployment workbooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "paramiko>=3.4,<6",
    "pyyaml>=6,<7",
]

[project.scripts]
se = "se:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
